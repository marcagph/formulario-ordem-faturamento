<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordem de Faturamento — Grupo Prestarh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary:     #F05A28;
  --primary-lt:  #FDE8E0;
  --dark:        #1A2A4E;
  --dark-md:     #2D4270;
  --dark-lt:     #EEF1F8;
  --gray-field:  #F0F2F7;
  --gray-line:   #E2E6F0;
  --white:       #FFFFFF;
  --text-muted:  #6B7A99;
  --radius:      10px;
  --radius-sm:   6px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: #F4F6FB;
  color: var(--dark);
  min-height: 100vh;
  padding: 32px 16px 60px;
}

/* ── TOPBAR ── */
.tabs { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.tab-btn {
  flex: 1; min-width: 160px; padding: 12px 20px;
  border: 2px solid var(--gray-line); border-radius: var(--radius);
  font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
  letter-spacing: .03em; cursor: pointer; background: var(--white);
  color: var(--text-muted); transition: all .18s;
}
.tab-btn.active { background: var(--dark); color: var(--white); border-color: var(--dark); }
.tab-btn:not(.active):hover { border-color: var(--dark-md); color: var(--dark); }

.action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.print-btn, .share-btn {
  display: flex; align-items: center; gap: 6px; padding: 10px 18px;
  color: var(--white); border: none; border-radius: 8px;
  font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: opacity .15s; white-space: nowrap;
}
.print-btn    { background: var(--primary); }
.whatsapp-btn { background: #25D366; }
.print-btn:hover, .share-btn:hover { opacity: .88; }
.print-btn svg, .share-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.print-btn:disabled, .share-btn:disabled { opacity: .6; cursor: not-allowed; }

.topbar {
  display: flex; gap: 12px; max-width: 820px;
  margin: 0 auto 20px; align-items: flex-start; flex-wrap: wrap;
  justify-content: flex-end;
}

/* ── CARD ── */
.card {
  max-width: 820px; margin: 0 auto; background: var(--white);
  border-radius: 16px; box-shadow: 0 4px 24px rgba(26,42,78,.10); overflow: hidden;
}

.card-header {
  background: var(--dark); padding: 22px 32px;
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
}
.header-title     { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.header-arrow     { color: var(--primary); font-size: 26px; line-height: 1; }
.header-doc-title { color: var(--white); font-size: 22px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
.header-logo      { text-align: right; flex-shrink: 0; white-space: nowrap; }
.logo-name { color: var(--white); font-size: 14px; font-weight: 700; letter-spacing: .02em; }
.logo-sub  { color: var(--primary); font-size: 10px; font-weight: 500; letter-spacing: .02em; margin-top: 2px; }

.card-body { padding: 28px 32px 36px; }

/* ── SEÇÕES ── */
.section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.section-icon {
  width: 22px; height: 22px; background: var(--primary); border-radius: 5px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.section-icon svg { width: 12px; height: 12px; fill: white; }
.section-label { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--dark); }

/* ── CAMPOS IDENTIFICAÇÃO ── */
.fields-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.field-row   { display: flex; align-items: center; gap: 12px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--text-muted); min-width: 170px; }
.field-input {
  flex: 1; background: var(--gray-field); border: 1.5px solid transparent;
  border-radius: var(--radius-sm); padding: 9px 14px;
  font-family: 'Inter', sans-serif; font-size: 13px; color: var(--dark);
  outline: none; transition: border-color .15s, background .15s;
}
.field-input:focus { border-color: var(--primary); background: var(--white); }
.date-field { max-width: 200px; flex: none; }
select.field-input { cursor: pointer; appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%236B7A99'><path d='M4 6l4 4 4-4H4z'/></svg>");
  background-repeat: no-repeat; background-position: right 12px center; padding-right: 34px; }

/* ── DIVISOR ── */
.divider      { height: 2px; background: var(--primary); border-radius: 2px; margin: 16px 0; }
.divider.full { margin: 20px 0; }

/* ── LEGENDA ── */
.legenda { background: var(--dark-lt); border-radius: var(--radius-sm); padding: 14px 18px; margin-top: 20px; }
.legenda-title {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--dark); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.legenda-title::before { content: ''; display: block; width: 3px; height: 14px; background: var(--primary); border-radius: 2px; }
.legenda-item { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
.legenda-item strong { color: var(--primary); }

/* ── PÁGINAS ── */
.page        { display: none; }
.page.active { display: block; }

@media (max-width: 560px) {
  .field-row { flex-direction: column; align-items: stretch; }
  .field-label { min-width: 0; }
  .date-field { max-width: none; }
}
</style>
</head>

<script>
/* ── CONFIGURAÇÃO ── */
var TOTAL_PAGES      = 1;
var TEXTAREA_CLASSES = '.sci-field, .ca-field';
var nomeArquivo      = 'Ordem_de_Faturamento.pdf';
/* ──────────────────────────────────── */

function showPage(n, btn) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('page' + n).classList.add('active');
  btn.classList.add('active');
}

function autoResize(el) {
  el.style.height = '1px';
  el.style.height = el.scrollHeight + 'px';
}

function setupDateMask(field) {
  field.addEventListener('input', function() {
    var digits = this.value.replace(/\D/g, '').slice(0, 8);
    var f = '';
    if (digits.length > 0) f += digits.slice(0, 2);
    if (digits.length > 2) f += '/' + digits.slice(2, 4);
    if (digits.length > 4) f += '/' + digits.slice(4, 8);
    this.value = f;
  });
}

document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll(TEXTAREA_CLASSES).forEach(function(ta) {
    ta.addEventListener('input',  function() { autoResize(this); });
    ta.addEventListener('paste',  function() { setTimeout(function() { autoResize(ta); }, 0); });
    ta.addEventListener('change', function() { autoResize(this); });
    autoResize(ta);
  });
  document.querySelectorAll('.date-field').forEach(setupDateMask);
});

async function gerarPDFBlob() {
  var jsPDF  = window.jspdf.jsPDF;
  var topbar = document.querySelector('.topbar');
  var card   = document.getElementById('formCard');

  await document.fonts.ready;

  var paginaAtiva = (document.querySelector('.page.active') || document.getElementById('page1')).id;

  topbar.style.visibility = 'hidden';
  card.style.maxWidth     = '820px';
  card.style.width        = '820px';

  var A4_W     = 210;
  var captures = [];

  for (var i = 1; i <= TOTAL_PAGES; i++) {

    document.querySelectorAll('.page').forEach(function(p) { p.style.display = 'none'; });
    var pageEl = document.getElementById('page' + i);
    pageEl.style.display = 'block';

    await new Promise(function(r) { setTimeout(r, 350); });

    var inputValues = [];
    pageEl.querySelectorAll('.field-input').forEach(function(inp) {
      inputValues.push(inp.value);
    });

    var textareaValues = [];
    pageEl.querySelectorAll(TEXTAREA_CLASSES).forEach(function(ta) {
      textareaValues.push(ta.value);
    });

    var pageIndex = i;

    var canvas = await html2canvas(pageEl, {
      scale:           2,
      useCORS:         true,
      allowTaint:      true,
      backgroundColor: '#ffffff',
      logging:         false,
      windowWidth:     820,

      onclone: function(clonedDoc) {
        var cp = clonedDoc.getElementById('page' + pageIndex);
        if (!cp) return;

        cp.querySelectorAll('.field-input').forEach(function(el, idx) {
          var d = clonedDoc.createElement('div');
          d.className          = el.className;
          d.style.display      = 'flex';
          d.style.alignItems   = 'center';
          d.style.whiteSpace   = 'nowrap';
          d.style.overflow     = 'hidden';
          d.style.textOverflow = 'ellipsis';
          d.textContent = inputValues[idx] || '';
          el.parentNode.replaceChild(d, el);
        });

        cp.querySelectorAll(TEXTAREA_CLASSES).forEach(function(el, idx) {
          var d = clonedDoc.createElement('div');
          d.className        = el.className;
          d.style.height     = 'auto';
          d.style.overflow   = 'visible';
          d.style.whiteSpace = 'pre-wrap';
          d.style.wordBreak  = 'break-word';
          d.textContent = textareaValues[idx] || '';
          el.parentNode.replaceChild(d, el);
        });
      }
    });

    captures.push({
      imgData:  canvas.toDataURL('image/png'),
      heightMm: (canvas.height / canvas.width) * A4_W
    });
  }

  var pdf = new jsPDF({
    orientation: 'portrait',
    unit:        'mm',
    format:      [A4_W, captures[0].heightMm]
  });

  pdf.addImage(captures[0].imgData, 'PNG', 0, 0, A4_W, captures[0].heightMm, undefined, 'FAST');

  for (var j = 1; j < captures.length; j++) {
    pdf.addPage([A4_W, captures[j].heightMm]);
    pdf.addImage(captures[j].imgData, 'PNG', 0, 0, A4_W, captures[j].heightMm, undefined, 'FAST');
  }

  topbar.style.visibility = '';
  card.style.maxWidth     = '';
  card.style.width        = '';
  document.querySelectorAll('.page').forEach(function(p) { p.style.display = ''; });
  document.getElementById(paginaAtiva).classList.add('active');
  var num = parseInt(paginaAtiva.replace('page', '')) - 1;
  document.querySelectorAll('.tab-btn').forEach(function(b, idx) {
    b.classList.toggle('active', idx === num);
  });

  return pdf.output('blob');
}

async function baixarPDF() {
  var btn = document.getElementById('btnPDF');
  var orig = btn.innerHTML;
  btn.innerHTML = '⏳ Gerando…';
  btn.disabled  = true;
  try {
    var blob = await gerarPDFBlob();
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = nomeArquivo; a.click();
    URL.revokeObjectURL(url);
  } catch(e) {
    alert('Não foi possível gerar o PDF. Tente novamente.');
  }
  btn.innerHTML = orig;
  btn.disabled  = false;
}

async function compartilharWhatsApp() {
  var btn = document.getElementById('btnWpp');
  var orig = btn.innerHTML;
  btn.innerHTML = '⏳ Gerando…';
  btn.disabled  = true;
  try {
    var blob    = await gerarPDFBlob();
    var arquivo = new File([blob], nomeArquivo, { type: 'application/pdf' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [arquivo] })) {
      await navigator.share({ title: nomeArquivo.replace('.pdf',''), files: [arquivo] });
    } else {
      var url = URL.createObjectURL(blob);
      var a   = document.createElement('a');
      a.href = url; a.download = nomeArquivo; a.click();
      URL.revokeObjectURL(url);
      setTimeout(function() { window.open('https://web.whatsapp.com', '_blank'); }, 800);
    }
  } catch(e) {
    if (e.name !== 'AbortError') alert('Não foi possível gerar o PDF. Tente novamente.');
  }
  btn.innerHTML = orig;
  btn.disabled  = false;
}

async function enviarEmail() {
  var btn = document.getElementById('btnEmail');
  var orig = btn.innerHTML;
  btn.innerHTML = '⏳ Gerando…';
  btn.disabled  = true;
  try {
    var blob = await gerarPDFBlob();
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = nomeArquivo; a.click();
    URL.revokeObjectURL(url);
    setTimeout(function() {
      window.location.href = 'mailto:?subject=' + encodeURIComponent('Ordem de Faturamento') +
        '&body=' + encodeURIComponent('Segue em anexo a Ordem de Faturamento (arquivo baixado: ' + nomeArquivo + ').');
    }, 800);
  } catch(e) {
    alert('Não foi possível gerar o PDF. Tente novamente.');
  }
  btn.innerHTML = orig;
  btn.disabled  = false;
}
